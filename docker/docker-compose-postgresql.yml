services:
  postgres:
    image: postgres:16-alpine
    container_name: flashticker_db
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-flashticket_db_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_DATABASE:-flashticket}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - flashticket_network

networks:
  flashticket_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
