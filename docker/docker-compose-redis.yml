services:
  redis:
    image: redis:7-alpine
    container_name: flashticket_redis
    restart: always
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - flashticket_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s

networks:
  flashticket_network:
    driver: bridge

volumes:
  redisdata:
    driver: local
